<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form đăng ký sinh viên</title>
</head>
<body>

    <h1>FORM ĐĂNG KÝ SINH VIÊN</h1>

    <form action="#" method="POST">
        <!-- 1. Họ tên (text + required + placeholder) -->
        <p>
            <label for="hoten">Họ tên:</label><br>
            <input type="text" id="hoten" name="hoten" placeholder="Nhập họ và tên..." required>
        </p>

        <!-- 2. Email (email + required + placeholder) -->
        <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="Nhập địa chỉ email..." required>
        </p>

        <!-- 3. Mật khẩu (password + placeholder) -->
        <p>
            <label for="password">Mật khẩu:</label><br>
            <input type="password" id="password" name="password" placeholder="Nhập mật khẩu...">
        </p>

        <!-- 4. Giới tính (radio) -->
        <p>
            <label>Giới tính:</label><br>
            <input type="radio" id="nam" name="gioitinh" value="Nam" checked>
            <label for="nam">Nam</label>
            <input type="radio" id="nu" name="gioitinh" value="Nữ">
            <label for="nu">Nữ</label>
            <input type="radio" id="khac" name="gioitinh" value="Khác">
            <label for="khac">Khác</label>
        </p>

        <!-- 5. Sở thích (checkbox) -->
        <p>
            <label>Sở thích:</label><br>
            <input type="checkbox" id="thethao" name="sothich" value="Thể thao">
            <label for="thethao">Thể thao</label>
            <input type="checkbox" id="amnhac" name="sothich" value="Âm nhạc">
            <label for="amnhac">Âm nhạc</label>
            <input type="checkbox" id="doolich" name="sothich" value="Du lịch">
            <label for="doolich">Du lịch</label>
        </p>

        <!-- 6. Ngành học (select) -->
        <p>
            <label for="nganhhoc">Ngành học:</label><br>
            <select id="nganhhoc" name="nganhhoc">
                <option value="CNTT">CNTT</option>
                <option value="Kinh tế">Kinh tế</option>
                <option value="Điện tử">Điện tử</option>
            </select>
        </p>

        <!-- 7. Ghi chú (textarea + placeholder) -->
        <p>
            <label for="ghichu">Ghi chú:</label><br>
            <textarea id="ghichu" name="ghichu" rows="4" cols="40" placeholder="Nhập ghi chú thêm..."></textarea>
        </p>

        <!-- 8. Nút gửi (submit) -->
        <p>
            <input type="submit" value="Đăng ký">
        </p>
    </form>

</body>
</html>v
